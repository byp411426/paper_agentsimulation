limited observation</text>
<text x="132.0" y="154" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">EventPack / World emit</text>
<text x="132.0" y="178" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">warning · hazard · road</text>
<text x="132.0" y="202" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">events; Interaction emits</text>
<text x="132.0" y="226" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">social messages. Resident</text>
<text x="132.0" y="250" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">sees only channel / location /</text>
<text x="132.0" y="274" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">access-conditioned facts.</text>
