<text x="870.0" y="178" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">vehicle, companions, departure</text>
<text x="870.0" y="202" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">time. Plan is intent only —</text>
<text x="870.0" y="226" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">no physical state change yet.</text>
