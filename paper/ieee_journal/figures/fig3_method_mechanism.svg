<text x="378.0" y="118" font-size="23" text-anchor="middle" fill="#2166AC" font-weight="bold" font-style="normal" opacity="1.0">2  Memory</text>
<text x="378.0" y="154" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">only processed info enters</text>
<text x="378.0" y="178" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">private memory; retrieve by</text>
<text x="378.0" y="202" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">recency, importance and</text>
<text x="378.0" y="226" font-size="17" text-anchor="middle" fill="#1F1F1F" font-weight="normal" font-style="normal" opacity="1.0">relevance for the current step.</text>
