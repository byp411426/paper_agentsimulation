[project]
name = "disastersociety"
version = "0.1.0"
description = "DisasterSociety: generative-agent social simulation for urban disasters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- core (M0/M1/M1.5): no heavy geo stack ---
    "litellm>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# --- M2 baselines ---
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "statsmodels>=0.14",
]
# --- M3 real world: heavy geo stack, install only when needed ---
geo = [
    "osmnx>=1.9",
    "geopandas>=0.14",
    "shapely>=2.0",
]
# --- analysis ---
analysis = [
    "duckdb>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ds = "ds.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ds"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
