version: 1
status: PILOT_VALIDATION_ONLY
track: Carr-R

data:
  clean_survey: eventpacks/carr_2018/behavior/survey_clean.csv
  evaluation_linkage: eventpacks/carr_2018/behavior/evaluation_respondents.csv
  split: experiments/carr/protocol/carr_r_split.csv
  field_roles: experiments/carr/protocol/field_roles.yaml

experiment:
  field_role_experiment: carr_r_prediction_primary
  train_split: train
  evaluation_splits:
    - validation
  sealed_splits:
    - test
  decision_threshold: 0.5
  ece_bins: 10
  bootstrap_replicates: 2000
  bootstrap_seed: 20260731

models:
  train_prevalence:
    kind: constant_prevalence
  logistic_regression:
    kind: logistic_regression
    class_weight: null
    max_iter: 1000
    random_state: 20260731
  logistic_regression_balanced:
    kind: logistic_regression
    class_weight: balanced
    max_iter: 1000
    random_state: 20260731
  random_forest_balanced:
    kind: random_forest
    class_weight: balanced
    n_estimators: 500
    max_depth: 5
    min_samples_leaf: 3
    random_state: 20260731

reporting:
  result_json: experiments/baselines/results/carr_r_validation_pilot.json
  predictions_csv: experiments/baselines/results/carr_r_validation_pilot_predictions.csv
  export_respondent_id: false
  interpretation: >-
    Development evidence on the validation split only. Confidence intervals
    condition on the fitted model and do not include training-set uncertainty.
    The sealed test split must not be opened by this configuration.
