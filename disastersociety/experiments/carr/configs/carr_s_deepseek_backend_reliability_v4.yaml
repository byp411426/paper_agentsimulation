run:
  run_id: carr_s_deepseek_backend_reliability_v4_project_env
  total_steps: 8
  step_minutes: 30

llm:
  decision_model: packy-deepseek-v4-flash
  models_config: configs/models.yaml
  temperature: 0.0
  max_concurrency: 4
  budget_usd: 0.15
  fallback_threshold: 0.01

experiment:
  evidence_status: PILOT
  activity_type: BACKEND_RELIABILITY_CHECK
  prompt_version: carr_s_controlled_resident_v4
  case_semantics: Carr-informed controlled mechanism scenario with TIGER-derived routes
  eventpack_root: eventpacks/carr_2018
  route_asset: environment/west_redding_controlled_routes.json
  n_households: 2
  min_dependents: 1
  max_household_size: 4
  controlled_zone: west_redding
  warning_step: 1
  closure_step_choices:
    - 3
    - 4
    - 5
    - 6
  depart_step: 5
  primary_route_id: tiger_primary
  alternate_route_id: tiger_alternate
  route_capacity_per_step: 8
  initial_hazard_distance_m: 6000
  hazard_approach_per_step_m: 700
  official_warning_delivery_probability: 0.65
  social_message_delivery_probability: 0.25

  reliability_protocol:
    execute_sequentially: true
    checks:
      - seed: 404
        condition: full
        diagnosed_failure: assessment_exceeded_schema_length
      - seed: 303
        condition: full_minus_memory
        diagnosed_failure: backend_timeout_under_parallel_batch_load
      - seed: 505
        condition: full_minus_memory
        diagnosed_failure: backend_timeout_under_parallel_batch_load
    purpose: verify assessment normalization and low-load backend completion
    formal_evidence: false
    substitute_for_v3_scientific_pairs: false
    test_split_opened: false
    expected_internal_cost_usd: 0.15
    expected_cost_is_provider_invoice: false

  phase_boundary:
    purpose: engineering reliability recheck after diagnosed backend-pilot failures
    formal_evidence: false
    test_split_opened: false
    historical_closure_reconstruction: false

  route_semantics:
    geometry: sourced 2018 TIGER/Line road network
    obstruction: algorithmic controlled perturbation
    historical_closure_observed: false
    traffic_scope: route-level capacity, not microscopic traffic reconstruction
