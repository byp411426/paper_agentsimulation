    execute_sequentially: true
    checks:
      - seed: 101
        condition: full
        diagnosed_failure: none
      - seed: 202
        condition: full_minus_memory
        diagnosed_failure: none
    purpose: >-
      minimal backend availability check under the formal v5 protocol
      (5 households, sequential execution, max_tokens=4096, lowered
      delivery probabilities) after provider credit restoration; the formal
      80-run matrix starts only if every check is VALID
    formal_evidence: false
    substitute_for_v3_scientific_pairs: false
    test_split_opened: false
    expected_internal_cost_usd: 0.60
    expected_cost_is_provider_invoice: false

  phase_boundary:
