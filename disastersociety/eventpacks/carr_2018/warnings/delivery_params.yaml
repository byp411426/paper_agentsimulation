# Carr Fire 预警送达模型参数（开发期校准版本，PILOT）
#
# 调整目标: 匹配同一问卷中的 47% 接收边际
# 因此该问卷边际不能再次充当独立验证目标。
# 当前理论: 0.92 × 0.85 × 0.9 = 70% (过高)
# 校准后: 0.85 × 0.75 × 0.8 = 51% (接近真值)

# 设备持有率(降低到 0.85,考虑手机关机/静音)
device_ownership: 0.85

# WEA 覆盖率(降低到 0.75,考虑山区信号盲区)
wea_coverage: 0.75

# 清醒时间
day_start_hour: 8
day_end_hour: 22

# 清醒时检查手机概率(降低到 0.8,考虑忙碌/忽略)
awake_check_prob: 0.8

# 睡眠时检查概率
asleep_check_prob: 0.3

# 校准后综合送达概率:
# 白天: 0.85 × 0.75 × 0.8 = 51%
# 夜间: 0.85 × 0.75 × 0.3 = 19%
