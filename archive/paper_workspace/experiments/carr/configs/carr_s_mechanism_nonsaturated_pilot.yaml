run:
  run_id: carr_s_mechanism_nonsaturated_pilot
  total_steps: 8
  step_minutes: 30

llm:
  decision_model: mock
  temperature: 0.0
  max_concurrency: 16
  budget_usd: 1.0
  fallback_threshold: 0.01

experiment:
  evidence_status: PILOT
  case_semantics: Carr-informed non-saturated controlled mechanism scenario
  eventpack_root: eventpacks/carr_2018
  n_households: 20
  min_dependents: 1
  max_household_size: 4
  controlled_zone: west_redding
  warning_step: 1
  closure_step_choices:
    - 3
    - 4
    - 5
    - 6
  depart_step: 5
  primary_route_id: controlled_primary
  alternate_route_id: controlled_alternate
  route_capacity_per_step: 8
  initial_hazard_distance_m: 6000
  hazard_approach_per_step_m: 700
  official_warning_delivery_probability: 0.65
  social_message_delivery_probability: 0.25

  population_scope:
    source: population/pilot_seed42_n1000
    filter: exactly two adults, one vehicle, one or two dependent members
    purpose: controlled mechanism identification, not population estimation

  scenario_controls:
    - Official warnings are independently delivered only to coordinators with probability 0.65.
    - Household direct messages are delivered with probability 0.25.
    - The primary abstract route closes at a paired-seed-selected step in 3, 4, 5, or 6.
    - Alternate-route capacity is eight household movements per step.
    - All stochastic controls use named streams shared by paired conditions.
    - Abstract routes and perturbations are not historical Carr closure claims.
